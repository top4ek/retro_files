main.CPUClock=6MHz
main.Caption="Vector-06c"
main.ff.speed=10
main.ff.keymask[8]=20
main.scale.x=100%
main.scale.y=150%
main.globalsound=1

CPU : Z80 {
  debug=cas
  debug=gate
  mem=mm
  port~[00-03]=sys.data
  port~[04-07]=ext.data
  port~[08-0B]=mtim.data
  port[0C-0F]=vid.color
  port[10]=mm.page
  port[14]=beep.data
  port[15]=beep.regno
  port~[18-1B]=dsk.data
  port[1C]=dskctl.data[0]
  port[20]=clock.regno
  port[21]=clock.data
  port[50-5F]=hdd.data
  port[ED]=gate.call
  rst[7]=vid.irq
  adjust=4
}

mem1 : Memory {
  size=10000
}

bios : Memory {
  rom="Vector06c\vector.epr"
  romselect="Change ROM BIOS"
  romfiles="Vector BIOS files (*.epr)|*.epr"
  icon=1
}

extrom : Memory {
  rom="Vector06c\vector.emr"
  romselect="Change external ROM"
  romoffset=100
  romfiles="ROM files (*.rom)|*.rom"
}

sys : K580ww55 {
  portA=kbd.~mask
  portB=kbd.~data
  portC[0]=cas.record
  portC[4]=cas.playback
  portC[5-7]=kbd.~data2
}

ext : K580ww55 {
  portA=extrom.lsb
  portB=extrom.data
  portC=extrom.msb
}

mm : V06c-MemMap {
  cpustate=cpu.state
  rom=bios[0000]
  stdmem=mem1[0000]
  ramdisk="Vector06c\vector.edd"
}

kbd : Keyboard {
  layout="Vector06c\layout.kbd"
}

vid : V06c-Video {
  mem=mem1[8000]
  scroll=sys.portA
  control=sys.portB
  ruslat=sys.portC[3]
}

mtim : K580wi53 {
  clock[0].rate=1/2
  clock[1].rate=1/2
  clock[2].rate=1/2
  gate[0].value=1
  gate[1].value=1
  gate[2].value=1
}

beep : AY-3-8910 {
  freq=08/1B
  input=sys.portC[0]
  input[0]=mtim.out[0]
  input[1]=mtim.out[1]
  input[2]=mtim.out[2]
}

dsk : KR1818wg93 {
  image[0].file="Vector06c\lines.fdd"
  image[1].file="Vector06c\stmpro.fdd"
  drive[0].tooltip="A:"
  drive[1].tooltip="B:"
  ext="fdd"
}

dskctl : K580ww55 {
  portA[0]=dsk.drive[0].~on
  portA[0]=dsk.drive[1].on
  portA[2]=dsk.side[0]
}

cas : tape-recorder {
  biproc[2B05-2B55]=rk
  biproc[2B05-2B55].check="C5D50E0057DB01E610"
  boproc[2B60-2B84]=sp
  boproc[2B60-2B84].check="C5D5F5570E087A0757"
  filter="Vector Basic files (*.cas)|*.cas"
  ext="cas"
}

gate : v06c-dosgate {
}

clock : KR512wi1 {
  cmos="Vector06c\cmos.dat"
}

hdd : cf-ide {
  drive[0].image="Vector06c\vector.hdd"
  drive[0].geometry=200C5H18S
}
